<style>
/* GigTrip mock. Built on GroupTrip's design system (same spacing, radii,
   buttons, sheets) with its own identity: gaffer-tape yellow, stencil-style
   condensed display type, mono for show times. */
:root {
  --bg: #f1f1ee;
  --surface: #ffffff;
  --surface-2: #e9e9e4;
  --surface-3: #dcdcd5;
  --text: #131316;
  --muted: #61616a;
  --faint: #9c9ca4;
  --line: rgba(19, 19, 22, .08);
  --line-strong: rgba(19, 19, 22, .16);
  --tape: #ffcc1a;
  --tape-ink: #141414;
  --accent-ink: #7a5a00;
  --good: #0f8a5f; --good-soft: #dcf3e8;
  --hold: #2f5bd3; --hold-soft: #e2e9fb;
  --offer: #7a3fc4; --offer-soft: #efe4fb;
  --warn: #a86a12; --warn-soft: #fbefd5;
  --bad: #d4383e; --bad-soft: #fde2e1;
  --ring: rgba(255, 204, 26, .55);
  --shadow: 0 1px 2px rgba(20, 16, 10, .04), 0 6px 20px rgba(20, 16, 10, .06);
  --font-ui: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r-lg: 22px; --r: 16px; --r-sm: 12px;
  --av-l: 86%; --av-ink: 27%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e10; --surface: #18181b; --surface-2: #222226; --surface-3: #2d2d32;
    --text: #f2f2f4; --muted: #a2a2ab; --faint: #6b6b73;
    --line: rgba(255, 255, 255, .07); --line-strong: rgba(255, 255, 255, .15);
    --tape: #ffd23a; --tape-ink: #141414; --accent-ink: #ffd23a;
    --good: #3ccf91; --good-soft: #10291f; --hold: #86a6ff; --hold-soft: #172042;
    --offer: #c29bff; --offer-soft: #271b3b; --warn: #f0b44c; --warn-soft: #2e2413;
    --bad: #ff6b6f; --bad-soft: #341617; --ring: rgba(255, 210, 58, .5);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --av-l: 30%; --av-ink: 86%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e10; --surface: #18181b; --surface-2: #222226; --surface-3: #2d2d32;
  --text: #f2f2f4; --muted: #a2a2ab; --faint: #6b6b73;
  --line: rgba(255, 255, 255, .07); --line-strong: rgba(255, 255, 255, .15);
  --tape: #ffd23a; --tape-ink: #141414; --accent-ink: #ffd23a;
  --good: #3ccf91; --good-soft: #10291f; --hold: #86a6ff; --hold-soft: #172042;
  --offer: #c29bff; --offer-soft: #271b3b; --warn: #f0b44c; --warn-soft: #2e2413;
  --bad: #ff6b6f; --bad-soft: #341617; --ring: rgba(255, 210, 58, .5);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --av-l: 30%; --av-ink: 86%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--text); font: 15px/1.5 var(--font-ui); letter-spacing: -.006em; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* type */
.display { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: .92; margin: 0; text-wrap: balance; }
h1.display { font-size: clamp(34px, 6vw, 52px); }
h2 { font-size: 18px; font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 600; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* shell */
.shell { display: grid; grid-template-columns: 1fr; min-height: 100%; }
.side { display: none; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--tape); color: var(--tape-ink); display: grid; place-items: center; font: 900 17px/1 var(--font-display); transform: rotate(-4deg); }
.brand b { font: 800 21px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; }
.top .spacer { flex: 1; }
.viewas { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; color: var(--muted); }
.viewas select { height: 34px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 10px; font-weight: 600; font-size: 13px; color: var(--text); }
main { padding: 18px 16px 110px; max-width: 1080px; width: 100%; margin: 0 auto; display: grid; gap: 18px; align-content: start; }
.ribbon { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ribbon .tapechip { background: var(--tape); color: var(--tape-ink); font-weight: 700; padding: 2px 8px; border-radius: 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }

.tabbar {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  display: flex; justify-content: space-around; padding: 6px; border-radius: 24px;
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(18px);
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.tabbar a { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 16px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; }
.tabbar a[aria-current="page"] { color: var(--text); background: var(--surface-2); }
.tabbar a[aria-current="page"] svg { color: var(--accent-ink); }

@media (min-width: 900px) {
  .shell { grid-template-columns: 244px 1fr; }
  .side {
    display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh;
    padding: 18px 14px; border-right: 1px solid var(--line); background: var(--surface);
  }
  .side .brand { padding: 4px 8px 18px; }
  .side nav { display: grid; gap: 2px; }
  .side nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; text-decoration: none; color: var(--muted); font-weight: 500; }
  .side nav a:hover { background: var(--surface-2); color: var(--text); }
  .side nav a[aria-current="page"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
  .side nav a[aria-current="page"] svg { color: var(--accent-ink); }
  .side .foot { margin-top: auto; font-size: 12.5px; color: var(--muted); padding: 8px; display: grid; gap: 6px; }
  .top .brand { display: none; }
  .tabbar { display: none; }
  main { padding: 26px 32px 60px; }
}

/* building blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; }
.card.flat { background: transparent; border: 0; padding: 0; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; gap: 18px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } .grid2.wide-left { grid-template-columns: 1.4fr 1fr; } }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head .sub { margin-top: 6px; }

.btn { height: 40px; padding: 0 16px; border-radius: 999px; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; transition: transform .15s ease, background-color .15s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--text); color: var(--bg); }
.btn-tape { background: var(--tape); color: var(--tape-ink); }
.btn-secondary { background: var(--surface-2); }
.btn-secondary:hover { background: var(--surface-3); }
.btn-outline { background: transparent; border: 1px solid var(--line-strong); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }

.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.st-confirmed { background: var(--good-soft); color: var(--good); }
.st-hold { background: var(--hold-soft); color: var(--hold); }
.st-offer { background: var(--offer-soft); color: var(--offer); }
.st-pencil { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); }
.st-cancelled { background: var(--bad-soft); color: var(--bad); }
.st-pending { background: var(--warn-soft); color: var(--warn); }
.st-settled { background: var(--surface-2); color: var(--muted); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { height: 32px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

.list { display: grid; }
.li { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li.click { cursor: pointer; border-radius: 12px; }
.li.click:hover { background: var(--surface-2); margin: 0 -10px; padding-inline: 10px; }
.li .grow { flex: 1; min-width: 0; }
.li .grow > * { overflow-wrap: anywhere; }

.datebox { width: 52px; flex: none; text-align: center; border-radius: 12px; background: var(--surface-2); padding: 6px 0 5px; }
.datebox .d { font: 800 24px/1 var(--font-display); }
.datebox .m { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.datebox.tape { background: var(--tape); color: var(--tape-ink); }
.datebox.tape .m { color: var(--tape-ink); opacity: .7; }
.cancelled-text { text-decoration: line-through; color: var(--faint); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.kv .total { font-weight: 700; font-size: 16px; border-top: 1px solid var(--line-strong); padding-top: 8px; }
.kv .total + .total { border-top: 0; padding-top: 0; }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--text); }
.bar.good > i { background: var(--good); }
.bar.over > i { background: var(--bad); }

.stat { display: grid; gap: 2px; }
.stat b { font: 800 30px/1 var(--font-display); letter-spacing: .01em; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stats .card { padding: 14px 16px; }

.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check:first-child { border-top: 0; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--good); flex: none; }
.check.done .lbl { color: var(--muted); text-decoration: line-through; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 12px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--tape); }

.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field input, .field select { height: 42px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 12px; font-size: 15px; color: var(--text); width: 100%; }
.field input:focus { outline: 3px solid var(--ring); outline-offset: 0; }

.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.r, th.r { text-align: right; }
tfoot td { font-weight: 700; border-bottom: 0; }

/* laminate (Today header) */
.laminate { position: relative; border-radius: var(--r-lg); overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.laminate .band { background: var(--tape); color: var(--tape-ink); padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; font: 800 15px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; }
.laminate .body { padding: 18px; display: grid; gap: 14px; }
.laminate .next { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.laminate .next .t { font: 600 40px/1 var(--font-mono); letter-spacing: -.02em; }

/* day sheet */
.sheet { display: grid; }
.slot { display: grid; grid-template-columns: 72px 1fr; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); align-items: baseline; }
.slot:first-child { border-top: 0; }
.slot .t { font: 600 16px/1.2 var(--font-mono); }
.slot.past { color: var(--faint); }
.slot.past .muted { color: var(--faint); }
.slot.now { background: color-mix(in srgb, var(--tape) 22%, transparent); margin: 0 -12px; padding-inline: 12px; border-radius: 12px; border-top-color: transparent; }
.slot.now + .slot { border-top-color: transparent; }
.slot.key .what { font-weight: 700; }

/* boarding pass */
.pass { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.pass .code { font: 800 38px/1 var(--font-display); }
.pass .mid { display: grid; justify-items: center; color: var(--muted); font-size: 12px; }
.pass .r { text-align: right; }
.perf { border-top: 2px dashed var(--line-strong); margin: 14px -18px; }

.map svg { width: 100%; height: auto; display: block; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 50; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) { .toast { bottom: 28px; } }

.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--tape); padding: 2px 0 2px 12px; }
.prose { max-width: 66ch; display: grid; gap: 12px; }
.prose p, .prose ol, .prose ul { margin: 0; }
.prose li + li { margin-top: 6px; }

/* party cards (expand for details) */
.pcard { border-top: 1px solid var(--line); }
.pcard:first-child { border-top: 0; }
.pcard > summary { list-style: none; display: flex; align-items: center; gap: 14px; padding: 12px 0; cursor: pointer; }
.pcard > summary::-webkit-details-marker { display: none; }
.pcard > summary .grow { flex: 1; min-width: 0; }
.pcard > summary .chev { color: var(--faint); transition: transform .15s; }
.pcard[open] > summary .chev { transform: rotate(90deg); }
.pcard .more { padding: 0 0 16px 50px; display: grid; gap: 14px; }
@media (max-width: 520px) { .pcard .more { padding-left: 0; } }
.supply { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.supply li { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
.supply li .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.supply li.ok .grow { color: var(--muted); }
.supply input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--good); flex: none; margin: 0; }
.supply .x { border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 8px; }
.supply .x:hover { color: var(--bad); background: var(--bad-soft); }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; height: 36px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 10px; font-size: 14px; }
.lvl { height: 32px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 8px; font-size: 13px; font-weight: 600; }
.lvl[data-l="off"] { color: var(--faint); }
.lvl[data-l="edit"] { color: var(--good); }
.lvl.custom { box-shadow: inset 0 0 0 2px var(--tape); }
.accgrid { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; font-size: 13.5px; }
.minihead { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cols2 { display: grid; gap: 18px; }
@media (min-width: 760px) { .cols2 { grid-template-columns: 1fr 1fr; } }
</style>

// settlement math — integer cents, "versus" deal: artist earns the larger of guarantee and % of net after expenses
function settle(s, d) {
  const gross = s.sold * s.price;
  const fees = s.sold * s.feePer;
  const net = gross - fees;
  const exp = s.expenses.reduce((a, e) => a + e[1], 0);
  const after = Math.max(0, net - exp);
  const share = pctOf(after, d.pct);
  const earns = Math.max(d.g, share);
  return { gross, fees, net, exp, after, share, earns, versusWins: share > d.g, due: earns - d.dep };
}
function showFee(s) {
  if (s.settled) return s.settled;
  if (s.id === 'nyc') return settle(NYC.settle, s.deal).earns;
  return s.deal.g;
}

        <button class="btn btn-primary btn-sm" data-offer="${o.id}" data-act="hold">Accept as hold</button>
        <button class="btn btn-secondary btn-sm" data-offer="${o.id}" data-act="counter">Counter</button>
        <button class="btn btn-outline btn-sm" data-offer="${o.id}" data-act="decline">Decline</button></div>` : ''}
    </article>`;
  return `
  <div class="head"><div><div class="eyebrow">From agents and promoters</div><h1 class="display">Offers</h1>

V.tour = () => {
  const total = SHOWS.reduce((a, s) => a + showFee(s), 0);
  return `
  <div class="head"><div><div class="eyebrow">${esc(ARTISTS[TOUR.artist])} · ${TOUR.season}</div><h1 class="display">${TOUR.name}</h1>

    <section class="card stack"><h2>Money so far</h2>
      <dl class="kv"><dt>Show fees (settled + expected)</dt><dd>${money(total)}</dd>
      <dt>Deposits received</dt><dd>${money(SHOWS.filter(s => s.done[1]).reduce((a, s) => a + s.deal.dep, 0))}</dd>
      <dt>Settled so far</dt><dd>${SHOWS.filter(s => s.settled).length} of ${SHOWS.length} shows</dd></dl>

  </div>
  <section class="card"><h2 style="margin-bottom:6px">Shows</h2><div class="list">
    ${SHOWS.map(s => `
      <div class="li click" data-show="${s.id}">

        <div class="grow"><div><b>${esc(s.city)}</b> · ${esc(s.venue)}${s.today ? ' <span class="chip st-pending plain">Today</span>' : ''}</div>
          <div class="small muted">${s.drive ? 'From previous: ' + esc(s.drive) + ' · ' : ''}${esc(dealText(s.deal))}</div>
          <div class="row small wrap" style="gap:10px;margin-top:6px"><div class="bar ${pctDone(s) === 100 ? 'good' : ''}" style="width:120px"><i style="width:${pctDone(s)}%"></i></div>
            <span class="muted">${pctDone(s)}% advanced</span>

        ${s.settled ? '<span class="chip st-settled">Settled</span>' : statusChip(s)}
      </div>`).join('')}

function routeMap() {
  const W = 620, H = 380, lon0 = -85, lon1 = -69, lat0 = 34, lat1 = 47;
  const P = ([la, lo]) => [((lo - lon0) / (lon1 - lon0)) * W, H - ((la - lat0) / (lat1 - lat0)) * H];
  const pts = SHOWS.map(s => P(s.ll));
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const labelLeft = { phl: true, dc: true, tor: true };
  return `<svg viewBox="-20 -10 ${W + 40} ${H + 20}" role="img" aria-label="Tour routing from Toronto to Asheville">
    <path d="${path}" fill="none" stroke="var(--faint)" stroke-width="2" stroke-dasharray="5 6"/>
    ${pts.map((p, i) => { const s = SHOWS[i]; const left = labelLeft[s.id]; return `
      <g>
        <circle cx="${p[0]}" cy="${p[1]}" r="13" fill="${s.today ? 'var(--tape)' : s.status === 'hold' ? 'var(--hold-soft)' : 'var(--text)'}" stroke="${s.status === 'hold' ? 'var(--hold)' : 'none'}" stroke-width="1.5"/>
        <text x="${p[0]}" y="${p[1] + 4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="${s.today ? 'var(--tape-ink)' : s.status === 'hold' ? 'var(--hold)' : 'var(--bg)'}" font-family="var(--font-ui)">${i + 1}</text>
        <text x="${p[0] + (left ? -20 : 20)}" y="${p[1] + 4}" text-anchor="${left ? 'end' : 'start'}" font-size="13" font-weight="600" fill="var(--text)" font-family="var(--font-ui)">${esc(s.city.split(',')[0])}</text>
        <text x="${p[0] + (left ? -20 : 20)}" y="${p[1] + 19}" text-anchor="${left ? 'end' : 'start'}" font-size="11" fill="var(--muted)" font-family="var(--font-ui)">${fmtDate(s.date)}</text>
      </g>`; }).join('')}
  </svg>`;
}

function showTabs() {
  const t = [];
  if (can('costs')) t.push(['deal', 'Deal']);
  if (can('advance')) t.push(['advance', 'Advance'], ['supply', 'Who brings what'], ['docs', 'Docs']);
  if (can('day')) t.push(['contacts', 'Contacts'], ['sheet', 'Day sheet']);
  return t;
}

V.show = () => {
  // venue people only ever see their own show
  if (PEOPLE[me()].kind === 'venue') S.showId = 'nyc';
  const s = show(S.showId);
  const isNyc = s.id === 'nyc';
  const tabs = showTabs();
  if (!tabs.some(t => t[0] === S.showTab)) S.showTab = tabs[0][0];
  const editAdv = can('advance', 'edit');
  let body = '';
  if (S.showTab === 'deal') {
    const fee = showFee(s);
    body = `<div class="grid2">
      <div class="stack"><dl class="kv">
        <dt>Deal</dt><dd>${esc(dealText(s.deal))}</dd>
        <dt>Guarantee</dt><dd>${money(s.deal.g)}</dd>
        ${s.deal.pct ? `<dt>Artist %</dt><dd>${s.deal.pct}% of net after show expenses</dd>` : ''}
        <dt>Deposit</dt><dd>${s.deal.dep ? money(s.deal.dep) + (s.done[1] ? ' · received' : ' · not yet') : 'None'}</dd>
        <dt>Capacity</dt><dd>${s.cap.toLocaleString()}</dd>
        <dt>${s.settled ? 'Settled at' : isNyc ? 'Tracking to' : 'Expected'}</dt><dd><b>${money(fee)}</b></dd>
      </dl>
      ${isNyc ? `<button class="btn btn-tape" data-go="settle">${icon('settle')} Open tonight's settlement</button>` : ''}</div>
      <div class="note">Real build: the ticketing page (Ticketmaster, AXS, Dice) and the venue site open here as embeds or new-tab buttons — GigTrip never copies ticket counts from them.</div>
    </div>`;
  } else if (S.showTab === 'advance') {
    body = `<div class="list">${ADVANCE.map(([lbl, who], i) => `
      <label class="check ${s.done[i] ? 'done' : ''}"><input type="checkbox" id="adv-${s.id}-${i}" data-adv="${i}" ${s.done[i] ? 'checked' : ''} ${editAdv ? '' : 'disabled'}>
        <span class="grow"><span class="lbl">${esc(lbl)}</span><br><span class="small muted">${esc(PEOPLE[who].name)} · due ${dueFor(s, i)}</span></span></label>`).join('')}</div>
      <p class="note">This replaces the per-show ClickUp list. Items come from a template the manager edits once.</p>`;
  } else if (S.showTab === 'supply') {
    body = whoBringsWhat();
  } else if (S.showTab === 'docs') {
    const docs = isNyc ? NYC.docs : [['Hospitality rider', 'v3', 'ok'], ['Tech rider + input list', 'v5', 'ok'], ['Stage plot', 'v5', 'ok'], ['Contract', s.done[0] ? 'Signed' : 'Waiting on promoter', s.done[0] ? 'ok' : 'pending']].concat(s.fest ? [['Artist credentials + wristbands', 'From festival advance', 'pending']] : []);
    const shown = can('costs') ? docs : docs.filter(d => !/Contract|Settlement/.test(d[0]));
    body = `<div class="list">${shown.map(([n, meta, st]) => `
      <div class="li click" data-toast="Opens ${esc(n)} (mock)"><span class="avatar" style="background:var(--surface-2);border-radius:10px">${icon('settle')}</span>
        <div class="grow"><b>${esc(n)}</b><div class="small muted">${esc(meta)}</div></div>
        <span class="chip ${st === 'ok' ? 'st-confirmed' : 'st-pending'}">${st === 'ok' ? 'Ready' : 'Waiting'}</span></div>`).join('')}</div>`;
  } else if (S.showTab === 'contacts') {
    body = contactsList(isNyc ? NYC.contacts : [['Promoter rep', 'Added during advance', '—']]);
  } else {
    body = isNyc ? daySheet() : `<p class="muted">The day sheet fills in as the show is advanced. Slots come from a template: lobby call, load-in, soundcheck, doors, set, curfew, settlement.</p>`;
  }
  const venue = PEOPLE[me()].kind === 'venue';
  return `
  <div class="head"><div><div class="eyebrow">${venue ? 'Your show' : `${esc(TOUR.name)} · show ${SHOWS.indexOf(s) + 1} of ${SHOWS.length}`}</div>
    <h1 class="display">${esc(s.city.split(',')[0])}</h1>
    <div class="sub muted">${fmtDate(s.date)} · ${esc(s.venue)} · cap ${s.cap.toLocaleString()}${s.fest ? ' · ' + esc(s.fest) : ''}</div></div>
    <div class="row">${s.settled ? '<span class="chip st-settled">Settled</span>' : statusChip(s)}
      ${venue ? '' : `<label class="viewas" for="pick">Show <select id="pick">${SHOWS.map(x => `<option value="${x.id}" ${x.id === s.id ? 'selected' : ''}>${fmtDate(x.date)} · ${esc(x.city.split(',')[0])}</option>`).join('')}</select></label>`}</div></div>
  <section class="card stack">
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${S.showTab === k}" data-tab="${k}">${k === 'advance' ? `${l} ${pctDone(s)}%` : l}</button>`).join('')}</div>
    ${body}
  </section>`;
};
function dueFor(s, i) {
  const d = dt(s.date); d.setDate(d.getDate() - (i < 2 ? 45 : i < 6 ? 21 : 7));
  return `${MON[d.getMonth()]} ${d.getDate()}`;
}
function contactsList(list) {
  return `<div class="list">${list.map(([n, r, ph]) => `
    <div class="li"><span class="avatar" style="background:var(--surface-2)">${esc(initials(n))}</span>
      <div class="grow"><b>${esc(n)}</b><div class="small muted">${esc(r)}</div></div>
      <span class="mono small" style="user-select:all">${esc(ph)}</span></div>`).join('')}</div>`;
}
function whoBringsWhat() {
  const venueIds = Object.keys(PEOPLE).filter(k => PEOPLE[k].kind === 'venue' && SUP[k]);

  return `<div class="sheet">${NYC.slots.map(([t, what, who, key], i) => `
    <div class="slot ${i < nowIdx ? 'past' : ''} ${i === nowIdx ? 'now' : ''} ${key ? 'key' : ''}">
      <span class="t">${t}</span><div><div class="what">${esc(what)}${i === nowIdx ? ' <span class="chip st-pending plain">Now</span>' : ''}</div><div class="small muted">${esc(who)}</div></div>

      ${venue ? '' : `<section class="card"><h2 style="margin-bottom:4px">Already settled</h2><div class="list">

    <div class="stack">${TRAVEL.flights.map(f => `
      <section class="card"><div class="row between small muted"><span>${f.date} · ${f.no}</span><span>Seat ${f.seat}</span></div>
        <div class="pass" style="margin-top:8px"><div><div class="code">${f.from}</div><div class="mono">${f.dep}</div></div>
          <div class="mid">${icon('travel')}</div>
          <div class="r"><div class="code">${f.to}</div><div class="mono">${f.arr}</div></div></div>
        ${f.next ? `<div class="small muted" style="margin-top:8px">${esc(f.next)}</div>` : ''}
        <div class="perf"></div><div class="row between small"><span class="muted">Confirmation</span><span class="mono" style="user-select:all">${f.conf}</span></div>
      </section>`).join('')}
      <p class="note">Flight times fill in from the flight number, same as GroupTrip.</p></div>
    <div class="stack">
      <section class="card"><h2 style="margin-bottom:4px">Van</h2><div class="list">${TRAVEL.van.map(([d, route, call, drive, done]) => `
        <div class="li"><div class="grow ${done ? 'muted' : ''}"><b>${esc(route)}</b><div class="small muted">${d} · ${call} · ${drive}</div></div>${done ? '<span class="chip st-settled">Done</span>' : ''}</div>`).join('')}</div></section>
      <section class="card"><h2 style="margin-bottom:4px">Rooms</h2><div class="list">${TRAVEL.hotels.map(([d, h]) => `
        <div class="li"><div class="grow"><b>${esc(h)}</b><div class="small muted">${d}${p.room ? ' · Room ' + p.room : ''}</div></div></div>`).join('')}</div></section>
    </div>
  </div>`;
};

V.mymoney = () => {
  const p = PEOPLE[me()];
  const days = DAYS_SO_FAR;
  const perDiems = PER_DIEM * days;
  const artist = p.kind === 'artist';
  const pay = p.pay ? p.pay * SHOWS_PLAYED : 0;
  return `
  <div class="head"><div><div class="eyebrow">${esc(p.name)} · only you see this</div><h1 class="display">My money</h1>
    <div class="sub muted">Your pay, per diems and expenses on ${esc(TOUR.name)}. Nobody else's.</div></div></div>
  <div class="stats">
    ${artist ? '' : `<div class="card stat"><span class="eyebrow">Pay so far</span><b>${money(pay)}</b><span class="small muted">${money(p.pay)} × ${SHOWS_PLAYED} shows</span></div>`}
    <div class="card stat"><span class="eyebrow">Per diems</span><b>${money(perDiems)}</b><span class="small muted">$50 × ${days} days</span></div>
    <div class="card stat"><span class="eyebrow">Expenses owed back</span><b>${money(14260)}</b><span class="small muted">1 waiting on Dana</span></div>
  </div>
  <section class="card"><h2 style="margin-bottom:4px">Expenses</h2><div class="list">
    <div class="li"><div class="grow"><b>Replacement ${p.tech ? 'SDI cable' : 'strings'}</b><div class="small muted">Apr 10 · Boston · receipt attached</div></div><b class="num">${money(8760)}</b><span class="chip st-pending">Waiting</span></div>
    <div class="li"><div class="grow"><b>Cab to venue</b><div class="small muted">Apr 8 · Toronto</div></div><b class="num">${money(5500)}</b><span class="chip st-confirmed">Paid back</span></div>
  </div><button class="btn btn-secondary btn-sm" style="margin-top:10px" data-toast="Snap a receipt, pick a category — same as GroupTrip business expenses (mock)">Add expense</button></section>
  ${artist ? `<p class="note">Your show earnings come through ${esc(PEOPLE.rae.name)} after each settlement. Management can also let you see show costs and profit.</p>` : `<p class="note">Management decides whether you see this page at all.</p>`}`;
};

V.budget = () => {
  const fees = SHOWS.reduce((a, s) => a + showFee(s), 0);
  const feesSettled = SHOWS.filter(s => s.settled).reduce((a, s) => a + s.settled, 0);
  const lines = [
    ...BUDGET,
    [`Agent commission (${AGENT_PCT}% of fees)`, pctOf(fees, AGENT_PCT), pctOf(feesSettled, AGENT_PCT)],
    [`Management commission (${MGMT_PCT}% of fees)`, pctOf(fees, MGMT_PCT), pctOf(feesSettled, MGMT_PCT)],
  ];
  const costB = lines.reduce((a, l) => a + l[1], 0), costA = lines.reduce((a, l) => a + l[2], 0);
  const income = fees + MERCH.budget;
  return `
  <div class="head"><div><div class="eyebrow">${esc(TOUR.name)} · to date Apr 12</div><h1 class="display">Tour budget</h1>
    <div class="sub muted">Budget vs actual. Actuals come from expenses, per diems and settlements.</div></div></div>
  <div class="stats">
    <div class="card stat"><span class="eyebrow">Projected income</span><b>${money(income)}</b></div>
    <div class="card stat"><span class="eyebrow">Budgeted costs</span><b>${money(costB)}</b></div>
    <div class="card stat"><span class="eyebrow">Projected net</span><b style="color:${income - costB >= 0 ? 'var(--good)' : 'var(--bad)'}">${money(income - costB)}</b></div>
    <div class="card stat"><span class="eyebrow">Spent so far</span><b>${money(costA)}</b></div>
  </div>
  <section class="card"><h2 style="margin-bottom:8px">Income</h2><div class="scroll-x"><table>
    <thead><tr><th>Source</th><th class="r">Budget</th><th class="r">So far</th></tr></thead>
    <tbody><tr><td>Show fees (${SHOWS.length} shows)</td><td class="r">${money(fees)}</td><td class="r">${money(feesSettled)}</td></tr>
      <tr><td>Merch (net)</td><td class="r">${money(MERCH.budget)}</td><td class="r">${money(MERCH.actual)}</td></tr></tbody>
    <tfoot><tr><td>Total</td><td class="r">${money(income)}</td><td class="r">${money(feesSettled + MERCH.actual)}</td></tr></tfoot></table></div></section>
  <section class="card"><h2 style="margin-bottom:8px">Costs</h2><div class="scroll-x"><table>
    <thead><tr><th>Category</th><th class="r">Budget</th><th class="r">Spent</th><th style="width:30%">Used</th></tr></thead>
    <tbody>${lines.map(([n, b, a]) => `<tr><td>${esc(n)}</td><td class="r">${money(b)}</td><td class="r">${money(a)}</td>
      <td><div class="bar ${a > b ? 'over' : ''}"><i style="width:${Math.min(100, Math.round(a / b * 100))}%"></i></div></td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="r">${money(costB)}</td><td class="r">${money(costA)}</td><td class="small muted">${Math.round(costA / costB * 100)}% used · ${Math.round(DAYS_SO_FAR / ROAD_DAYS * 100)}% of tour done</td></tr></tfoot></table></div></section>
  <p class="note">Crew enter expenses with receipt photos on their phone (GroupTrip's business expenses). Per diems are paid out automatically per road day.</p>`;
};

// ---- party: expandable cards; management sets role, access and what each person brings ----
function personCard(k) {
  const p = PEOPLE[k];
  const mgr = isMgr();
  const venueViewer = PEOPLE[me()].kind === 'venue';
  const showPhone = !venueViewer || p.kind === 'venue' || p.kind === 'tm';
  const list = SUP[k] || [];
  const custom = Object.keys(p.over).length;
  const supplyLabel = p.kind === 'venue' ? 'Venue provides' : 'Brings';
  const mine = k === me();
  return `<details class="pcard" data-person="${k}" ${S.open.has(k) ? 'open' : ''}>
    <summary>${avatar(k)}<div class="grow"><b>${esc(p.name)}</b>${mine ? ' <span class="chip plain">You</span>' : ''}<div class="small muted">${esc(p.role)}${list.length ? ` · ${supplyLabel.toLowerCase()} ${list.length} item${list.length > 1 ? 's' : ''}` : ''}</div></div>
      ${mgr && custom ? '<span class="chip st-pending plain">Custom access</span>' : ''}${icon('chev', 'chev')}</summary>
    <div class="more">
      <dl class="kv small">
        ${showPhone ? `<dt>Phone</dt><dd class="mono" style="user-select:all">${p.ph}</dd>` : ''}
        <dt>Role</dt><dd>${mgr && p.kind !== 'manager' ? `<select class="lvl" id="kind-${k}" data-kind="${k}">${Object.entries(KINDS).filter(([x]) => x !== 'manager').map(([x, l]) => `<option value="${x}" ${p.kind === x ? 'selected' : ''}>${l}</option>`).join('')}</select>` : esc(KINDS[p.kind])}</dd>
        ${p.room && (mgr || can('travel', 'edit')) ? `<dt>Room</dt><dd>${p.room}</dd>` : ''}
      </dl>
      <div class="stack" style="gap:6px">
        <div class="minihead">${supplyLabel}</div>
        ${list.length ? `<ul class="supply">${list.map((x, i) => `<li class="${x.ok ? 'ok' : ''}">
          ${mine ? `<input type="checkbox" id="psup-${k}-${i}" data-sup="${k}" data-i="${i}" ${x.ok ? 'checked' : ''}>` : ''}
          <span class="grow">${esc(x.t)}</span>
          ${mine ? '' : x.ok ? '<span class="chip st-confirmed plain">Confirmed</span>' : '<span class="chip st-pending plain">Not yet</span>'}
          ${mgr ? `<button class="x" type="button" data-unsup="${k}" data-i="${i}" aria-label="Remove ${esc(x.t)}">×</button>` : ''}</li>`).join('')}</ul>`
          : `<p class="small muted" style="margin:0">Nothing set yet.</p>`}
        ${mgr ? `<form class="addrow" data-addsup="${k}"><input id="add-${k}" placeholder="${p.kind === 'venue' ? 'e.g. Projector + screen' : 'e.g. HDMI → SDI converter'}" autocomplete="off" aria-label="Add an item for ${esc(p.name)}"><button class="btn btn-secondary btn-sm" type="submit">Add</button></form>` : ''}
      </div>
      ${mgr && p.kind !== 'manager' ? `<div class="stack" style="gap:6px">
        <div class="row between"><span class="minihead">What ${esc(p.name.split(' ')[0])} can see</span>${custom ? `<button class="btn btn-outline btn-sm" data-reset="${k}">Back to ${esc(KINDS[p.kind])} defaults</button>` : ''}</div>
        <div class="accgrid">${AREAS.map(([a, l]) => { const o = p.over[a]; const v = level(k, a); return `<span>${l}</span>
          <select class="lvl ${o ? 'custom' : ''}" data-l="${v}" id="ov-${k}-${a}" data-over="${k}" data-area="${a}" aria-label="${esc(l)} for ${esc(p.name)}">
            ${['off', 'view', 'edit'].map(x => `<option value="${x}" ${v === x ? 'selected' : ''}>${x === 'off' ? 'Hidden' : x === 'view' ? 'View' : 'Edit'}${!o && ACCESS[p.kind][a] === x ? ' (default)' : ''}</option>`).join('')}</select>`; }).join('')}</div>
        <p class="small muted" style="margin:0">Yellow outline = changed just for ${esc(p.name.split(' ')[0])}.</p></div>` : ''}
    </div></details>`;
}

V.party = () => {
  const venueViewer = PEOPLE[me()].kind === 'venue';
  const ids = g => Object.keys(PEOPLE).filter(k => PEOPLE[k].group === g);
  const road = venueViewer ? ids('road').filter(k => PEOPLE[k].kind === 'tm' || PEOPLE[k].tech) : ids('road');
  const office = ids('office'), venue = ids('venue');
  const sec = (title, list, extra = '') => `<section class="card"><h2 style="margin-bottom:4px">${title}</h2><div class="list">${list.map(personCard).join('')}</div>${extra}</section>`;
  return `
  <div class="head"><div><div class="eyebrow">${esc(TOUR.name)}</div><h1 class="display">${venueViewer ? 'Tour team' : 'Touring party'}</h1>
    <div class="sub muted">${venueViewer ? 'The people you\'ll work with today and what they bring.' : isMgr() ? 'Tap a person to set what they bring and what they can see.' : 'Tap a person to see what they\'re bringing.'}</div></div>
    ${isMgr() ? `<div class="row wrap"><button class="btn btn-secondary" data-go="access">${icon('access')} Role defaults</button><button class="btn btn-tape" data-toast="Copies a join link for this tour (mock)">Invite someone</button></div>` : ''}</div>
  ${venueViewer ? sec('Venue', venue) + sec('Tour team', road) : `<div class="grid2">
    <div class="stack">${sec('On the road', road)}</div>
    <div class="stack">${sec('Venue — tonight', venue)}${sec('Office', office)}</div></div>`}`;
};

V.access = () => {
  const cols = ['tm', 'artist', 'crew', 'venue', 'agent'];
  const custom = Object.keys(PEOPLE).filter(k => Object.keys(PEOPLE[k].over).length);
  return `
  <div class="head"><div><div class="eyebrow">Management only</div><h1 class="display">Who sees what</h1>
    <div class="sub muted">Defaults for each role on ${esc(TOUR.name)}. Change one person on their card in Party.</div></div></div>
  <section class="card"><div class="scroll-x"><table>
    <thead><tr><th>Area</th><th>Management</th>${cols.map(c => `<th>${KINDS[c]}</th>`).join('')}</tr></thead>
    <tbody>${AREAS.map(([a, l]) => `<tr><td style="white-space:normal;min-width:180px">${l}</td><td><span class="chip st-confirmed plain">Edit</span></td>
      ${cols.map(c => `<td><select class="lvl" data-l="${ACCESS[c][a]}" id="acc-${c}-${a}" data-acc="${c}" data-area="${a}" aria-label="${esc(l)} for ${KINDS[c]}">
        ${['off', 'view', 'edit'].map(x => `<option value="${x}" ${ACCESS[c][a] === x ? 'selected' : ''}>${x === 'off' ? 'Hidden' : x === 'view' ? 'View' : 'Edit'}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>
  <div class="row wrap" style="margin-top:14px"><span class="small muted">Try it:</span>${['tm', 'artist', 'crew', 'venue'].map(c => `<button class="btn btn-outline btn-sm" data-preview="${c}">See it as ${KINDS[c]}</button>`).join('')}</div></section>
  <div class="grid2">
    <section class="card stack"><h2>Money has three levels</h2>
      <dl class="kv small"><dt>My money</dt><dd>own pay, per diems, expenses</dd><dt>Show costs</dt><dd>deals, venue expenses, settlement</dd><dt>Profit</dt><dd>net per show and tour, commissions, budget</dd></dl>
      <p class="note">So a tour manager can settle a show without seeing what the tour makes, and crew can see their own pay and nothing else.</p></section>
    <section class="card"><h2 style="margin-bottom:4px">People with their own access</h2>
      ${custom.length ? `<div class="list">${custom.map(k => `<div class="li click" data-open="${k}">${avatar(k)}<div class="grow"><b>${esc(PEOPLE[k].name)}</b><div class="small muted">${Object.entries(PEOPLE[k].over).map(([a, v]) => `${AREAS.find(x => x[0] === a)[1].split(' (')[0]}: ${v === 'off' ? 'hidden' : v}`).join(' · ')}</div></div></div>`).join('')}</div>`
        : '<p class="muted" style="margin:0">Nobody yet — everyone follows their role.</p>'}</section>
  </div>`;
};

V.about = () => `
  <div class="head"><div><div class="eyebrow">Prototype · sample data</div><h1 class="display">What is GigTrip?</h1></div></div>
  <section class="card prose">
    <p><b>GigTrip is for artist managers and everyone who makes a show happen.</b> It puts the dates sheet, each show's deal and settlement, the advance checklist, who brings what, day sheets, travel and guest lists in one place — instead of Excel for dates and money, ClickUp for advancing, and group texts for everything else.</p>
    <p><b>Management decides who sees what.</b> The tour manager, artist, band and crew, and the venue each get only what they need. Costs and profit can be hidden separately.</p>
    <p>It's built on <a href="https://timdreamboat.github.io/grouptrip/" target="_blank" rel="noopener">GroupTrip</a>, which already handles travel, shared plans, people and expenses for groups.</p>
    <p class="muted">Use <b>View as</b> at the top to switch between management, the tour manager, the artist, band &amp; crew (you're Nico, the VJ) and the venue (you're Greg, production manager). Everyone, venues and numbers here are made up.</p>
  </section>`;

// ---------- router ----------
function route() {
  const nav = navFor();
  let r = location.hash.slice(1);
  if (!V[r] || !nav.some(n => n[0] === r)) r = nav[0][0];
  const links = list => list.map(([k, l]) => `<a href="#${k}" ${k === r ? 'aria-current="page"' : ''}>${icon(k)}<span>${l}</span></a>`).join('');
  $('#sidenav').innerHTML = links(nav);
  $('#tabbar').innerHTML = links(nav.filter(n => n[0] !== 'about').slice(0, 5));
  $('#main').innerHTML = V[r]();
  $('#role').value = S.role;
}
function go(r) { if (location.hash.slice(1) === r) route(); else location.hash = r; }
function setRole(r) { S.role = r; store.set('role', r); go(navFor()[0][0]); }

addEventListener('hashchange', () => { route(); scrollTo(0, 0); });
$('#role').addEventListener('change', e => setRole(e.target.value));

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.pcard')) d.open ? S.open.add(d.dataset.person) : S.open.delete(d.dataset.person);
}, true);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-show],[data-tab],[data-toast],[data-offer],[data-guest],[data-filter] button,[data-unsup],[data-reset],[data-preview],[data-open]');
  if (!t) return;
  if (t.dataset.toast) return toast(t.dataset.toast);
  if (t.dataset.show) { S.showId = t.dataset.show; S.showTab = ''; return navFor().some(n => n[0] === 'show') ? go('show') : toast('Management and the tour manager open the show page'); }
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.tab) { S.showTab = t.dataset.tab; return route(); }
  if (t.dataset.preview) { setRole(t.dataset.preview); return toast(`Now seeing GigTrip as ${KINDS[t.dataset.preview]}`); }
  if (t.dataset.open) { S.open.add(t.dataset.open); return go('party'); }
  if (t.dataset.unsup) { e.preventDefault(); const it = SUP[t.dataset.unsup].splice(+t.dataset.i, 1)[0]; toast(`Removed “${it.t}”`); return route(); }
  if (t.dataset.reset) { e.preventDefault(); PEOPLE[t.dataset.reset].over = {}; toast('Back to role defaults'); return route(); }
  if (t.dataset.offer) {
    const o = OFFERS.find(x => x.id === t.dataset.offer);
    if (t.dataset.act === 'counter') return toast(`Counter sent to ${o.promoter} (mock)`);
    o.status = t.dataset.act === 'hold' ? 'hold' : 'declined';
    if (o.status === 'hold') o.hold = 1;
    toast(o.status === 'hold' ? `${o.city} is on the season board as Hold 1` : `Declined ${o.city}`);
    return route();
  }
  if (t.dataset.guest) { GUESTS[+t.dataset.guest].status = t.dataset.act; toast(t.dataset.act === 'approved' ? 'Approved — on the list' : 'Declined'); return route(); }
  const f = t.closest('[data-filter]');
  if (f) { S[f.dataset.filter] = t.dataset.v; route(); }
});
document.addEventListener('change', e => {
  const d = e.target.dataset;
  if (d.adv) {
    const s = show(S.showId); s.done[+d.adv] = e.target.checked;
    route(); toast(e.target.checked ? 'Marked done' : 'Marked not done');
  }
  if (e.target.id === 'pick') { S.showId = e.target.value; route(); }
  if (d.sup) { const it = SUP[d.sup][+d.i]; it.ok = e.target.checked; toast(it.ok ? 'Confirmed — management can see it' : 'Marked not ready'); route(); }
  if (d.acc) { ACCESS[d.acc][d.area] = e.target.value; toast(`${KINDS[d.acc]}: ${AREAS.find(a => a[0] === d.area)[1].split(' (')[0]} → ${e.target.selectedOptions[0].text}`); route(); }
  if (d.over) {
    const p = PEOPLE[d.over];
    if (e.target.value === ACCESS[p.kind][d.area]) delete p.over[d.area]; else p.over[d.area] = e.target.value;
    toast(`${p.name.split(' ')[0]}'s access updated`); route();
  }
  if (d.kind) { PEOPLE[d.kind].kind = e.target.value; toast(`${PEOPLE[d.kind].name} is now ${KINDS[e.target.value]}`); route(); }
});
document.addEventListener('input', e => {
  if (!['sold', 'price', 'feeper'].includes(e.target.id)) return;
  const st = NYC.settle;
  const cents = v => Math.round(parseFloat(String(v).replace(/[^0-9.]/g, '')) * 100);
  const sold = parseInt($('#sold').value.replace(/\D/g, ''), 10), price = cents($('#price').value), fee = cents($('#feeper').value);
  if (Number.isFinite(sold)) st.sold = sold;
  if (Number.isFinite(price)) st.price = price;
  if (Number.isFinite(fee)) st.feePer = fee;
  $('#settle-sheet').innerHTML = settleRows(settle(st, show('nyc').deal), st, show('nyc').deal);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.addsup) {
    e.preventDefault();
    const k = f.dataset.addsup, input = f.querySelector('input'), txt = input.value.trim();
    if (!txt) return;
    (SUP[k] ||= []).push({ t: txt, ok: false });
    S.open.add(k);
    toast(`Added for ${PEOPLE[k].name.split(' ')[0]} — shows on their Today screen`);
    route();
    const again = document.getElementById('add-' + k); if (again) again.focus();
    return;
  }
  if (f.id !== 'guestform') return;
  e.preventDefault();
  const name = $('#gname').value.trim();
  if (!name) return;
  const approve = can('guests', 'edit');
  GUESTS.push({ name, plus: +$('#gplus').value, by: me(), status: approve ? 'approved' : 'pending' });
  toast(approve ? 'Added to the list' : 'Sent to Dana for approval');
  route();
});

route();
</script>
