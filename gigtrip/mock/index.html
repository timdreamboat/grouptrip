<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GigTrip</title>
<meta name="description" content="GigTrip V1 prototype — roster, tours, shows, advancing, day sheets, settlements and access control for artist managers and their teams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* GigTrip mock. Built on GroupTrip's design system (same spacing, radii,
   buttons, sheets) with its own identity: gaffer-tape yellow, stencil-style
   condensed display type, mono for show times. */
:root {
  --bg: #f1f1ee;
  --surface: #ffffff;
  --surface-2: #e9e9e4;
  --surface-3: #dcdcd5;
  --text: #131316;
  --muted: #61616a;
  --faint: #85858e;
  --line: rgba(19, 19, 22, .08);
  --line-strong: rgba(19, 19, 22, .16);
  --tape: #ffcc1a;
  --tape-ink: #141414;
  --accent-ink: #7a5a00;
  --good: #0f8a5f; --good-soft: #dcf3e8;
  --hold: #2f5bd3; --hold-soft: #e2e9fb;
  --offer: #7a3fc4; --offer-soft: #efe4fb;
  --warn: #a86a12; --warn-soft: #fbefd5;
  --bad: #d4383e; --bad-soft: #fde2e1;
  --ring: rgba(255, 204, 26, .55);
  --shadow: 0 1px 2px rgba(20, 16, 10, .04), 0 6px 20px rgba(20, 16, 10, .06);
  --font-ui: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r-lg: 22px; --r: 16px; --r-sm: 12px;
  --av-l: 86%; --av-ink: 27%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e10; --surface: #18181b; --surface-2: #222226; --surface-3: #2d2d32;
    --text: #f2f2f4; --muted: #a8a8b1; --faint: #7f7f89;
    --line: rgba(255, 255, 255, .07); --line-strong: rgba(255, 255, 255, .15);
    --tape: #ffd23a; --tape-ink: #141414; --accent-ink: #ffd23a;
    --good: #3ccf91; --good-soft: #10291f; --hold: #86a6ff; --hold-soft: #172042;
    --offer: #c29bff; --offer-soft: #271b3b; --warn: #f0b44c; --warn-soft: #2e2413;
    --bad: #ff6b6f; --bad-soft: #341617; --ring: rgba(255, 210, 58, .5);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --av-l: 30%; --av-ink: 86%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e10; --surface: #18181b; --surface-2: #222226; --surface-3: #2d2d32;
  --text: #f2f2f4; --muted: #a8a8b1; --faint: #7f7f89;
  --line: rgba(255, 255, 255, .07); --line-strong: rgba(255, 255, 255, .15);
  --tape: #ffd23a; --tape-ink: #141414; --accent-ink: #ffd23a;
  --good: #3ccf91; --good-soft: #10291f; --hold: #86a6ff; --hold-soft: #172042;
  --offer: #c29bff; --offer-soft: #271b3b; --warn: #f0b44c; --warn-soft: #2e2413;
  --bad: #ff6b6f; --bad-soft: #341617; --ring: rgba(255, 210, 58, .5);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --av-l: 30%; --av-ink: 86%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--text); font: 15px/1.5 var(--font-ui); letter-spacing: -.006em; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* type */
.display { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: .92; margin: 0; text-wrap: balance; }
h1.display { font-size: clamp(34px, 6vw, 52px); }
h2 { font-size: 18px; font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 600; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* shell */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.shell > div { min-width: 0; }
main > * { min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.side { display: none; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--tape); color: var(--tape-ink); display: grid; place-items: center; font: 900 17px/1 var(--font-display); transform: rotate(-4deg); }
.brand b { font: 800 21px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; }
.top .spacer { flex: 1; }
.viewas { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; color: var(--muted); }
.viewas select { height: 34px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 10px; font-weight: 600; font-size: 13px; color: var(--text); }
main { padding: 18px 16px 110px; max-width: 1080px; width: 100%; margin: 0 auto; display: grid; gap: 18px; align-content: start; }
.ribbon { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ribbon .tapechip { background: var(--tape); color: var(--tape-ink); font-weight: 700; padding: 2px 8px; border-radius: 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }

.tabbar {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  display: flex; justify-content: space-around; padding: 6px; border-radius: 24px;
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(18px);
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.tabbar a { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 16px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; }
.tabbar a[aria-current="page"] { color: var(--text); background: var(--surface-2); }
.tabbar a[aria-current="page"] svg { color: var(--accent-ink); }

@media (min-width: 900px) {
  .shell { grid-template-columns: 244px minmax(0, 1fr); }
  .side {
    display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh;
    padding: 18px 14px; border-right: 1px solid var(--line); background: var(--surface);
  }
  .side .brand { padding: 4px 8px 18px; }
  .side nav { display: grid; gap: 2px; }
  .side nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; text-decoration: none; color: var(--muted); font-weight: 500; }
  .side nav a:hover { background: var(--surface-2); color: var(--text); }
  .side nav a[aria-current="page"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
  .side nav a[aria-current="page"] svg { color: var(--accent-ink); }
  .side .foot { margin-top: auto; font-size: 12.5px; color: var(--muted); padding: 8px; display: grid; gap: 6px; }
  .top .brand { display: none; }
  .tabbar { display: none; }
  main { padding: 26px 32px 60px; }
}

/* building blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; }
.card.flat { background: transparent; border: 0; padding: 0; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; gap: 18px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } .grid2.wide-left { grid-template-columns: 1.4fr 1fr; } }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head .sub { margin-top: 6px; }

.btn { height: 40px; padding: 0 16px; border-radius: 999px; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; transition: transform .15s ease, background-color .15s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--text); color: var(--bg); }
.btn-tape { background: var(--tape); color: var(--tape-ink); }
.btn-secondary { background: var(--surface-2); }
.btn-secondary:hover { background: var(--surface-3); }
.btn-outline { background: transparent; border: 1px solid var(--line-strong); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }

.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.st-confirmed { background: var(--good-soft); color: var(--good); }
.st-hold { background: var(--hold-soft); color: var(--hold); }
.st-offer { background: var(--offer-soft); color: var(--offer); }
.st-pencil { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); }
.st-cancelled { background: var(--bad-soft); color: var(--bad); }
.st-pending { background: var(--warn-soft); color: var(--warn); }
.st-settled { background: var(--surface-2); color: var(--muted); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { height: 32px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

.list { display: grid; }
.li { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li.click { cursor: pointer; border-radius: 12px; }
.li.click:hover { background: var(--surface-2); margin: 0 -10px; padding-inline: 10px; }
.li .grow { flex: 1; min-width: 0; }
.li .grow > * { overflow-wrap: anywhere; }

.datebox { width: 52px; flex: none; text-align: center; border-radius: 12px; background: var(--surface-2); padding: 6px 0 5px; }
.datebox .d { font: 800 24px/1 var(--font-display); }
.datebox .m { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.datebox.tape { background: var(--tape); color: var(--tape-ink); }
.datebox.tape .m { color: var(--tape-ink); opacity: .7; }
.cancelled-text { text-decoration: line-through; color: var(--faint); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.kv .total { font-weight: 700; font-size: 16px; border-top: 1px solid var(--line-strong); padding-top: 8px; }
.kv .total + .total { border-top: 0; padding-top: 0; }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--text); }
.bar.good > i { background: var(--good); }
.bar.over > i { background: var(--bad); }

.stat { display: grid; gap: 2px; }
.stat b { font: 800 30px/1 var(--font-display); letter-spacing: .01em; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stats .card { padding: 14px 16px; }

.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check:first-child { border-top: 0; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--good); flex: none; }
.check.done .lbl { color: var(--muted); text-decoration: line-through; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 12px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--tape); }

.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field input, .field select { height: 42px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 12px; font-size: 15px; color: var(--text); width: 100%; }
.field input:focus { outline: 3px solid var(--ring); outline-offset: 0; }

.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.r, th.r { text-align: right; }
tfoot td { font-weight: 700; border-bottom: 0; }

/* laminate (Today header) */
.laminate { position: relative; border-radius: var(--r-lg); overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.laminate .band { background: var(--tape); color: var(--tape-ink); padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; font: 800 15px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; }
.laminate .body { padding: 18px; display: grid; gap: 14px; }
.laminate .next { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.laminate .next .t { font: 600 40px/1 var(--font-mono); letter-spacing: -.02em; }

/* day sheet */
.sheet { display: grid; }
.slot { display: grid; grid-template-columns: 72px 1fr; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); align-items: baseline; }
.slot:first-child { border-top: 0; }
.slot .t { font: 600 16px/1.2 var(--font-mono); }
.slot.past { color: var(--faint); }
.slot.past .muted { color: var(--faint); }
.slot.now { background: color-mix(in srgb, var(--tape) 22%, transparent); margin: 0 -12px; padding-inline: 12px; border-radius: 12px; border-top-color: transparent; }
.slot.now + .slot { border-top-color: transparent; }
.slot.key .what { font-weight: 700; }

/* boarding pass */
.pass { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.pass .code { font: 800 38px/1 var(--font-display); }
.pass .mid { display: grid; justify-items: center; color: var(--muted); font-size: 12px; }
.pass .r { text-align: right; }
.perf { border-top: 2px dashed var(--line-strong); margin: 14px -18px; }

.map svg { width: 100%; height: auto; display: block; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 50; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) { .toast { bottom: 28px; } }

.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--tape); padding: 2px 0 2px 12px; }
.prose { max-width: 66ch; display: grid; gap: 12px; }
.prose p, .prose ol, .prose ul { margin: 0; }
.prose li + li { margin-top: 6px; }

/* party cards (expand for details) */
.pcard { border-top: 1px solid var(--line); }
.pcard:first-child { border-top: 0; }
.pcard > summary { list-style: none; display: flex; align-items: center; gap: 14px; padding: 12px 0; cursor: pointer; }
.pcard > summary::-webkit-details-marker { display: none; }
.pcard > summary .grow { flex: 1; min-width: 0; }
.pcard > summary .chev { color: var(--faint); transition: transform .15s; }
.pcard[open] > summary .chev { transform: rotate(90deg); }
.pcard .more { padding: 0 0 16px 50px; display: grid; gap: 14px; }
@media (max-width: 520px) { .pcard .more { padding-left: 0; } }
.supply { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.supply li { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
.supply li .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.supply li.ok .grow { color: var(--muted); }
.supply input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--good); flex: none; margin: 0; }
.supply .x { border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 8px; }
.supply .x:hover { color: var(--bad); background: var(--bad-soft); }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; height: 36px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 10px; font-size: 14px; }
.lvl { height: 32px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 8px; font-size: 13px; font-weight: 600; }
.lvl[data-l="off"] { color: var(--faint); }
.lvl[data-l="edit"] { color: var(--good); }
.lvl.custom { box-shadow: inset 0 0 0 2px var(--tape); }
.accgrid { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; font-size: 13.5px; }
.minihead { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cols2 { display: grid; gap: 18px; }
@media (min-width: 760px) { .cols2 { grid-template-columns: 1fr 1fr; } }

/* ---- V1: editing, dialogs, uploads, tables ---- */
dialog.sheet { border: 0; padding: 0; background: var(--surface); color: var(--text); border-radius: 22px; width: min(580px, calc(100% - 24px)); max-height: calc(100% - 40px); box-shadow: 0 18px 48px rgba(0, 0, 0, .28); }
dialog.sheet:not([open]) { display: none; }
dialog.sheet::backdrop { background: rgba(10, 10, 12, .45); }
dialog.sheet > form { padding: 20px; display: grid; gap: 14px; }
@media (max-width: 640px) { dialog.sheet { margin: auto auto 0; width: 100%; max-width: 100%; border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); } }
.fgrid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.fgrid .full { grid-column: 1 / -1; }
@media (max-width: 480px) { .fgrid { grid-template-columns: 1fr; } }
.field textarea { min-height: 88px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); padding: 10px 12px; color: var(--text); width: 100%; resize: vertical; font: inherit; font-size: 15px; }
.field.checkf { grid-template-columns: auto 1fr; align-items: center; gap: 10px; color: var(--text); font-size: 14px; }
.field.checkf input { width: 20px; height: 20px; accent-color: var(--good); }
.iconbtn { width: 34px; height: 34px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: inline-grid; place-items: center; flex: none; text-decoration: none; }
.iconbtn:hover { background: var(--surface-2); color: var(--text); }
.iconbtn svg { width: 17px; height: 17px; }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.upload { position: relative; display: grid; place-items: center; gap: 2px; padding: 18px; border: 2px dashed var(--line-strong); border-radius: 16px; color: var(--muted); text-align: center; cursor: pointer; font-size: 14px; }
.upload b { color: var(--text); }
.upload.drag { border-color: var(--tape); background: color-mix(in srgb, var(--tape) 12%, transparent); }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.bell { position: relative; }
.bell .badge { position: absolute; top: 1px; right: 0; min-width: 17px; height: 17px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
th button.sort { all: unset; cursor: pointer; }
th button.sort:focus-visible { outline: 3px solid var(--ring); }
td.sel, th.sel { width: 36px; padding-right: 0; }
td.sel input, th.sel input { width: 17px; height: 17px; accent-color: var(--text); }

const money = (c, cents = false, cur = '') => (c < 0 ? '−' : '') + (cur === 'CAD' ? 'CA$' : '$') + (Math.abs(c || 0) / 100).toLocaleString('en-US', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
const pctOf = (c, p) => Math.round(c * p / 100);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const dt = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = iso => { if (!iso) return '—'; const d = dt(iso); return `${DAY[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`; };
const short = iso => { if (!iso) return '—'; const d = dt(iso); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const ampm = t => { let [h, m] = t.split(':').map(Number); const p = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${p}`; };
const daysUntil = iso => Math.round((dt(iso) - dt(NOW.date)) / 864e5);

// ---------- money ----------
function sheetFor(s) { return DB.sheets[s.id] ||= { sold: Math.round(s.cap * .9), price: 3500, feePer: 300, withholding: 0 }; }
function settle(s) {
  const st = sheetFor(s), d = s.deal;
  const gross = st.sold * st.price, fees = st.sold * st.feePer, net = gross - fees;
  const exp = DB.showExp.filter(e => e.show === s.id).reduce((a, e) => a + e.cents, 0);
  const after = Math.max(0, net - exp);
  let share = 0, earns = d.g;
  if (d.type === 'vs') { share = pctOf(after, d.pct); earns = Math.max(d.g, share); }
  if (d.type === 'door') { share = pctOf(net, d.pct); earns = share; }
  const dep = d.depPaid ? d.dep : 0;
  return { gross, fees, net, exp, after, share, earns, versusWins: d.type === 'vs' && share > d.g, dep, wh: st.withholding || 0, due: earns - dep - (st.withholding || 0) };
}
const showFee = s => s.settled != null ? s.settled : (s.id === 'nyc' ? settle(s).earns : s.deal.g);

function fieldHtml(f, v) {
  const id = 'f-' + f.k.replace(/\./g, '-');
  const val = v == null ? '' : v;
  const cls = `field${f.full ? ' full' : ''}`;
  if (f.type === 'select') return `<label class="${cls}" for="${id}">${f.label}<select id="${id}" name="${f.k}">${f.options.map(([o, l]) => `<option value="${esc(o)}" ${String(val) === String(o) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
  if (f.type === 'textarea') return `<label class="${cls}" for="${id}">${f.label}<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea></label>`;
  if (f.type === 'check') return `<label class="${cls} checkf" for="${id}"><input type="checkbox" id="${id}" name="${f.k}" ${val ? 'checked' : ''}><span>${f.label}</span></label>`;
  if (f.type === 'file') return `<label class="${cls}" for="${id}">${f.label}<input type="file" id="${id}" name="${f.k}" ${f.accept ? `accept="${f.accept}"` : ''} style="height:auto;padding:10px"></label>`;
  const shown = f.type === 'money' ? (val === '' ? '' : (val / 100).toFixed(2)) : val;
  const type = f.type === 'money' || f.type === 'number' ? 'text' : (f.type || 'text');
  const mode = f.type === 'money' ? 'decimal' : f.type === 'number' ? 'numeric' : '';
  return `<label class="${cls}" for="${id}">${f.label}<input id="${id}" name="${f.k}" type="${type}" ${mode ? `inputmode="${mode}"` : ''} value="${esc(shown)}" placeholder="${esc(f.ph || '')}" ${f.req ? 'required' : ''} autocomplete="off"></label>`;
}
function openForm({ title, fields, value = {}, submit = 'Save', onSave, onDelete, extra = '', top = '', wide }) {
  const d = $('#dlg');
  d.innerHTML = `<form id="dlgform" novalidate>
    <div class="row between"><h2>${esc(title)}</h2><button type="button" class="iconbtn" data-close aria-label="Close">×</button></div>
    ${top}
    ${fields.length ? `<div class="fgrid">${fields.map(f => fieldHtml(f, getp(value, f.k))).join('')}</div>` : ''}
    ${extra}
    <div class="row between wrap">${onDelete ? '<button type="button" class="btn btn-danger btn-sm" data-del>Delete</button>' : '<span></span>'}
      <div class="row"><button type="button" class="btn btn-secondary" data-close>Cancel</button>${onSave ? `<button class="btn btn-primary" type="submit">${esc(submit)}</button>` : ''}</div></div>
  </form>`;
  d.style.width = wide ? 'min(760px, calc(100% - 24px))' : '';
  const form = d.querySelector('form');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const out = {};
    for (const f of fields) {
      const el = form.elements[f.k];
      if (!el) continue;
      let v = f.type === 'check' ? el.checked : f.type === 'file' ? el.files[0] || null : el.value.trim();
      if (f.type === 'money') v = v === '' ? 0 : Math.round(parseFloat(String(v).replace(/[^0-9.\-]/g, '')) * 100) || 0;
      if (f.type === 'number') v = v === '' ? 0 : parseInt(String(v).replace(/[^0-9\-]/g, ''), 10) || 0;
      if (f.req && (v === '' || v == null)) { el.focus(); toast(`${f.label} is needed`); return; }
      out[f.k] = v;
    }
    if (onSave(out, form) === false) return;
    d.close(); save(); route();
  });
  form.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => d.close()));
  const del = form.querySelector('[data-del]');
  if (del) del.addEventListener('click', () => {
    if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = 'Tap again to delete'; return; }
    onDelete(); d.close(); save(); route();
  });
  d.showModal();
  const first = form.querySelector('input:not([type=checkbox]):not([type=file]),select,textarea');
  if (first && !('ontouchstart' in window)) first.focus();
}

// profile picture: center-crop to a square and shrink to 320px, stored on the artist
function toAvatar(file) {
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const n = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas');
      c.width = c.height = 320;
      c.getContext('2d').drawImage(img, (img.naturalWidth - n) / 2, (img.naturalHeight - n) / 2, n, n, 0, 0, 320, 320);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', .85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('not an image')); };
    img.src = url;
  });
}
function setArtistPhoto(a, file) {
  toAvatar(file).then(u => { a.photo = u; commit(`New picture for ${a.name}`, `Changed ${a.name}'s profile picture`); }, () => toast("That file isn't a picture we can read"));
}
function attachFile(obj, file) {
  const fid = uid('f');
  FILES[fid] = { url: URL.createObjectURL(file), name: file.name, type: file.type, size: file.size };
  obj.file = fid;
}
function uploadFiles(target, id, files) {
  if (!files || !files.length) return;
  [...files].forEach(file => {
    if (target === 'docs') {
      const d = { id: uid('d'), show: id, name: file.name.replace(/\.[^.]+$/, ''), meta: `${fileSize(file.size)} · uploaded by ${P(me()).name.split(' ')[0]}`, status: 'ok', file: null };
      attachFile(d, file); DB.docs.push(d);
    }
  });
  commit(`${files.length} file${files.length > 1 ? 's' : ''} uploaded`, `Uploaded ${files.length} file${files.length > 1 ? 's' : ''} to ${cityOf(show(id))}`);
}

const csvCell = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

function addSlots(s, r, g, impId, counts, ids) {

    counts.slots++; if (!impId) return;
    const sl = { id: uid('s'), show: s.id, time: t, label, who: '', key: k === 'set', src: impId }; DB.slots.push(sl); ids.slots.push(sl.id);

function undoImport(id) {
  const rec = DB.imports.find(x => x.id === id); if (!rec) return;
  const drop = k => { DB[k] = DB[k].filter(x => x.src !== id); };
  const showIds = new Set(rec.ids.shows || []);
  ['tasks', 'slots', 'contacts', 'guests', 'travel', 'budget', 'docs', 'showExp'].forEach(k => { DB[k] = DB[k].filter(x => x.src !== id && !showIds.has(x.show)); });
  drop('shows'); drop('tours');
  DB.artists = DB.artists.filter(a => a.src !== id || DB.shows.some(s => s.artist === a.id));
  DB.imports = DB.imports.filter(x => x !== rec);
  if (!show(S.showId)) S.showId = null;
  commit('Import undone — everything it created is gone', `Undid import from ${rec.source} (${rec.file})`);
}

// hand a generated file to the viewer: through the claude.ai viewer when the page runs there, else a plain browser download
async function saveFile(filename, text) {
  const dl = window.claude && typeof claude.use === 'function' ? await claude.use('downloads') : null;
  if (dl) {
    try { await dl.save({ filename, data: text }); toast(`Saved ${filename}`); }
    catch (e) { if (e && e.code === 'declined') return; toast('Could not save here — use Copy all instead'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

function routeMap(shows) {
  const pts0 = shows.filter(s => s.ll && s.status !== 'cancelled');
  if (pts0.length < 1) return '<p class="muted">Add cities we recognise (or coordinates) to see the route.</p>';
  const lats = pts0.map(s => s.ll[0]), lons = pts0.map(s => s.ll[1]);
  const pad = 1.5, lat0 = Math.min(...lats) - pad, lat1 = Math.max(...lats) + pad, lon0 = Math.min(...lons) - pad * 2, lon1 = Math.max(...lons) + pad * 2;
  const W = 620, H = 380;
  const Pt = ([la, lo]) => [((lo - lon0) / (lon1 - lon0 || 1)) * W, H - ((la - lat0) / (lat1 - lat0 || 1)) * H];
  const pts = pts0.map(s => Pt(s.ll));
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="-20 -10 ${W + 40} ${H + 20}" role="img" aria-label="Tour routing">
    <path d="${path}" fill="none" stroke="var(--faint)" stroke-width="2" stroke-dasharray="5 6"/>
    ${pts.map((p, i) => { const s = pts0[i]; const left = p[0] > W * .7; const today = s.date === NOW.date; const hold = s.status !== 'confirmed'; return `
      <g data-show="${s.id}" style="cursor:pointer">
        <circle cx="${p[0]}" cy="${p[1]}" r="13" fill="${today ? 'var(--tape)' : hold ? 'var(--hold-soft)' : 'var(--text)'}" stroke="${hold ? 'var(--hold)' : 'none'}" stroke-width="1.5"/>
        <text x="${p[0]}" y="${p[1] + 4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="${today ? 'var(--tape-ink)' : hold ? 'var(--hold)' : 'var(--bg)'}" font-family="var(--font-ui)">${i + 1}</text>
        <text x="${p[0] + (left ? -20 : 20)}" y="${p[1] + 4}" text-anchor="${left ? 'end' : 'start'}" font-size="13" font-weight="600" fill="var(--text)" font-family="var(--font-ui)">${esc(cityOf(s))}</text>
        <text x="${p[0] + (left ? -20 : 20)}" y="${p[1] + 19}" text-anchor="${left ? 'end' : 'start'}" font-size="11" fill="var(--muted)" font-family="var(--font-ui)">${fmtDate(s.date)}</text>
      </g>`; }).join('')}
  </svg>`;
}

function daySheet(showId, edit) {
  const slots = DB.slots.filter(x => x.show === showId).sort((a, b) => a.time.localeCompare(b.time));
  const today = show(showId).date === NOW.date;
  const next = slots.findIndex(x => toMin(x.time) > NOW.min);
  const nowIdx = today ? (next === -1 ? slots.length - 1 : next - 1) : -2;
  return `<div class="sheet">${slots.map((x, i) => `
    <div class="slot ${i < nowIdx ? 'past' : ''} ${i === nowIdx ? 'now' : ''} ${x.key ? 'key' : ''}">
      <span class="t">${x.time}</span><div class="row between" style="align-items:flex-start"><div><div class="what">${esc(x.label)}${i === nowIdx ? ' <span class="chip st-pending plain">Now</span>' : ''}</div><div class="small muted">${esc(x.who || '')}</div></div>${edit ? editBtn('slot', x.id, `Edit ${x.label}`) : ''}</div>
    </div>`).join('')}</div>`;
}

    <div class="stack">

        <label class="field" for="wh" style="flex:1;min-width:100px">Withholding tax<input id="wh" inputmode="decimal" value="${((st.withholding || 0) / 100).toFixed(2)}" ${edit ? '' : 'disabled'}></label>

function settleRows(s, r) {

V.money = () => {
  const tabs = [['deposits', 'Deposits due'], ['commission', 'Commissions'], ['budget', 'Tour budget']];
  let body = '';
  const edit = isMgr();
  if (S.moneyTab === 'deposits') {
    const rows = DB.shows.filter(s => inCur(s.artist) && s.deal.dep && s.status !== 'cancelled').sort((a, b) => (a.deal.depDue || '9').localeCompare(b.deal.depDue || '9'));
    const state = s => s.deal.depPaid ? ['Received', 'st-confirmed'] : !s.deal.depDue ? ['No date', 'st-pencil'] : daysUntil(s.deal.depDue) < 0 ? ['Overdue', 'st-cancelled'] : daysUntil(s.deal.depDue) <= 14 ? ['Due soon', 'st-pending'] : ['Upcoming', 'st-hold'];
    const out = rows.filter(s => !s.deal.depPaid);
    body = `<div class="stats">
        <div class="card stat"><span class="eyebrow">Outstanding</span><b>${money(out.reduce((a, s) => a + s.deal.dep, 0))}</b></div>
        <div class="card stat"><span class="eyebrow">Overdue</span><b style="color:var(--bad)">${money(out.filter(s => s.deal.depDue && daysUntil(s.deal.depDue) < 0).reduce((a, s) => a + s.deal.dep, 0))}</b></div>
        <div class="card stat"><span class="eyebrow">Received</span><b>${money(rows.filter(s => s.deal.depPaid).reduce((a, s) => a + s.deal.dep, 0))}</b></div></div>
      <div class="scroll-x"><table><thead><tr><th>Due</th><th>Artist</th><th>Show</th><th class="r">Deposit</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows.map(s => { const [l, c] = state(s); return `<tr><td>${short(s.deal.depDue)}</td><td>${esc(artist(s.artist).name)}</td><td>${short(s.date)} · ${esc(cityOf(s))}</td><td class="r">${money(s.deal.dep, false, s.cur)}</td><td><span class="chip ${c}">${l}</span></td>
        <td>${edit && !s.deal.depPaid ? `<button class="btn btn-outline btn-sm" data-act="depPaid" data-id="${s.id}">Mark received</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>
      <p class="note">Real build: "Needs attention" and a push reminder 7 days before each deposit is due.</p>`;
  } else if (S.moneyTab === 'commission') {
    if (cur() !== 'all') S.commArtist = cur();
    const a = artist(S.commArtist);
    const rows = DB.shows.filter(s => s.artist === S.commArtist && s.settled != null).sort((x, y) => x.date.localeCompare(y.date));
    const { agentPct, mgmtPct } = DB.settings;
    const sum = rows.reduce((t, s) => { const ag = pctOf(s.settled, agentPct), mg = pctOf(s.settled, mgmtPct); t.fee += s.settled; t.ag += ag; t.mg += mg; t.net += s.settled - ag - mg; return t; }, { fee: 0, ag: 0, mg: 0, net: 0 });
    body = `<div class="row wrap between"><label class="viewas" for="commpick">Artist <select id="commpick">${myArtists().map(x => `<option value="${x.id}" ${S.commArtist === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>
        <button class="btn btn-secondary btn-sm" data-toast="Statement PDF for ${esc(a.name)} (mock)">Send statement</button></div>
      <div class="scroll-x"><table><thead><tr><th>Date</th><th>Show</th><th class="r">Fee</th><th class="r">Agent ${agentPct}%</th><th class="r">Mgmt ${mgmtPct}%</th><th class="r">To artist</th></tr></thead>
        <tbody>${rows.map(s => `<tr><td>${short(s.date)}</td><td>${esc(cityOf(s))} · ${esc(s.venue)}</td><td class="r">${money(s.settled)}</td><td class="r">${money(pctOf(s.settled, agentPct))}</td><td class="r">${money(pctOf(s.settled, mgmtPct))}</td><td class="r">${money(s.settled - pctOf(s.settled, agentPct) - pctOf(s.settled, mgmtPct))}</td></tr>`).join('') || `<tr><td colspan="6" class="muted">No settled shows yet.</td></tr>`}</tbody>
        <tfoot><tr><td colspan="2">Total</td><td class="r">${money(sum.fee)}</td><td class="r">${money(sum.ag)}</td><td class="r">${money(sum.mg)}</td><td class="r">${money(sum.net)}</td></tr></tfoot></table></div>
      <p class="note">Commission rates are set in Settings. Amounts are before the artist's own costs; mixed currencies are shown as settled.</p>`;
  } else {
    const tours = DB.tours.filter(x => inCur(x.artist));
    if (!tours.some(x => x.id === S.tourId)) S.tourId = tours[0]?.id;
    const t = tour(S.tourId);
    if (!t) body = '<p class="muted">No tours for this artist yet — budgets are set per tour.</p>';
    else {
    const shows = DB.shows.filter(s => s.tour === t.id && s.status !== 'cancelled');
    const fees = shows.reduce((a, s) => a + showFee(s), 0), feesSettled = shows.filter(s => s.settled != null).reduce((a, s) => a + s.settled, 0);
    const lines = DB.budget.filter(b => b.tour === t.id);
    const comm = [[`Agent commission (${DB.settings.agentPct}%)`, pctOf(fees, DB.settings.agentPct), pctOf(feesSettled, DB.settings.agentPct)], [`Management commission (${DB.settings.mgmtPct}%)`, pctOf(fees, DB.settings.mgmtPct), pctOf(feesSettled, DB.settings.mgmtPct)]];
    const costB = lines.reduce((a, l) => a + l.budget, 0) + comm.reduce((a, c) => a + c[1], 0);
    const costA = lines.reduce((a, l) => a + l.actual, 0) + comm.reduce((a, c) => a + c[2], 0);
    body = `<div class="row wrap between"><label class="viewas" for="btour">Tour <select id="btour">${tours.map(x => `<option value="${x.id}" ${x.id === t.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>${edit ? addBtn('newBudget', 'Add line', t.id) : ''}</div>
      <div class="stats">
        <div class="card stat"><span class="eyebrow">Show fees</span><b>${money(fees)}</b></div>
        <div class="card stat"><span class="eyebrow">Net costs (budget)</span><b>${money(costB)}</b></div>
        <div class="card stat"><span class="eyebrow">Projected profit</span><b style="color:${fees - costB >= 0 ? 'var(--good)' : 'var(--bad)'}">${money(fees - costB)}</b></div>
        <div class="card stat"><span class="eyebrow">Spent so far</span><b>${money(costA)}</b></div></div>
      <div class="scroll-x"><table><thead><tr><th>Category</th><th class="r">Budget</th><th class="r">So far</th><th style="width:26%">Used</th><th></th></tr></thead>
        <tbody>${lines.map(l => `<tr><td>${esc(l.cat)}</td><td class="r">${money(l.budget)}</td><td class="r">${money(l.actual)}</td><td>${l.budget > 0 ? `<div class="bar ${l.actual > l.budget ? 'over' : ''}"><i style="width:${Math.min(100, Math.round(l.actual / l.budget * 100))}%"></i></div>` : '<span class="small muted">income</span>'}</td><td>${edit ? editBtn('budget', l.id) : ''}</td></tr>`).join('')}
          ${comm.map(([n, b, a]) => `<tr><td>${n}</td><td class="r">${money(b)}</td><td class="r">${money(a)}</td><td><div class="bar"><i style="width:${b ? Math.round(a / b * 100) : 0}%"></i></div></td><td class="small muted">auto</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Total</td><td class="r">${money(costB)}</td><td class="r">${money(costA)}</td><td colspan="2"></td></tr></tfoot></table></div>
      <p class="note">Negative lines are income (merch). Actuals fill in from crew expenses, per diems and settlements in the real build.</p>`;
    }
  }
  return `
  <div class="head"><div><div class="eyebrow">${cur() === 'all' ? 'Northlight Mgmt · all artists' : esc(artist(cur()).name)}</div><h1 class="display">Money</h1><div class="sub muted">Deposits, commissions and tour budgets across the roster.</div></div></div>
  <section class="card stack"><div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${S.moneyTab === k}" data-mtab="${k}">${l}</button>`).join('')}</div>${body}</section>`;
};

function route() {
  const nav = navFor();
  let r = location.hash.slice(1);
  if (r !== 'more' && (!V[r] || !nav.some(n => n[0] === r))) r = nav[0][0];
  const links = list => list.map(([k, l]) => `<a href="#${k}" ${k === r ? 'aria-current="page"' : ''}>${icon(k in ICONS ? k : 'about')}<span>${l}</span></a>`).join('');
  $('#sidenav').innerHTML = GROUPS.map(([g, keys]) => { const items = nav.filter(n => keys.includes(n[0])); return items.length ? (nav.length > 6 ? `<div class="grp">${g}</div>` : '') + links(items) : ''; }).join('');
  const main = nav.filter(n => n[0] !== 'about');
  $('#tabbar').innerHTML = main.length > 5 ? links(main.slice(0, 4)) + `<a href="#more" ${r === 'more' ? 'aria-current="page"' : ''}>${icon('more')}<span>More</span></a>` : links(main);
  const att = attention().length;
  const ca = cur();
  $('#achipslot').innerHTML = hasHome() ? `<a class="achip" href="#home" aria-label="Switch artist (now ${ca === 'all' ? 'all artists' : esc(artist(ca).name)})">${ca === 'all' ? `<span class="ph aph" style="background:var(--tape)">${icon('board')}</span>` : artistPh(artist(ca))}<span class="nm">${ca === 'all' ? 'All artists' : esc(artist(ca).name)}</span>▾</a>` : '';
  $('#bellslot').innerHTML = canEdit('advance') ? `<a class="iconbtn bell" href="#activity" aria-label="Activity, ${att} need attention">${icon('activity')}${att ? `<span class="badge">${att}</span>` : ''}</a>` : '';
  $('#main').innerHTML = V[r]();
  const h1 = $('#main .head h1'); if (h1 && HELP[r]) { h1.outerHTML = `<div class="titlerow">${h1.outerHTML}${helpBtn(r)}</div>`; }
  S.page = r;
  $('#role').value = S.role;
  applyTheme();
}
function go(r) { if (location.hash.slice(1) === r) route(); else location.hash = r; }

    pickShowInCur();
    go(id === 'all' ? (navFor().some(n => n[0] === 'board') ? 'board' : 'show') : isMgr() ? 'overview' : 'today');
    toast(id === 'all' ? 'Showing all artists' : `Now working on ${artist(id).name}`);
  }, offer: id => E.offer(id), newOffer: () => E.offer(null),
  task: id => E.task(id), newTask: id => E.task(null, { show: id }), slot: id => E.slot(id), newSlot: id => E.slot(null, { show: id }),
  doc: id => E.doc(id), contact: id => E.contact(id), newContact: id => E.contact(null, { show: id }), person: id => E.person(id), newPerson: () => E.person(null),
  guest: id => E.guest(id), travel: id => E.travel(id), newTravel: () => E.travel(null), supply: id => E.supply(id), newSupply: () => E.supply(null),
  budget: id => E.budget(id), newBudget: id => E.budget(null, { tour: id }), showExp: id => E.showExp(id), newExp: id => E.showExp(null, { show: id }),
  myexp: id => E.myexp(id), newMyExp: () => E.myexp(null), tmplAdv: id => E.tmpl(id, 'advance'), newTmplAdv: () => E.tmpl(null, 'advance'), tmplSlot: id => E.tmpl(id, 'slots'), newTmplSlot: () => E.tmpl(null, 'slots'),
  import: () => openImportWizard(), importFrom: id => openImportWizard({ source: id }), export: () => openExport('shows'),
  undoImport: (id, el) => { if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = 'Tap again to undo'; return; } undoImport(id); },
  help: id => openHelp(id === '__page' ? S.page : id),
  hideStart: () => { store.set('start.hidden', true); route(); },
  startStep: (k, el) => { const done = store.get('start.done', {}); if (k !== 'import') done[k] = true; store.set('start.done', done); if (k === 'import') openImportWizard(); else if (k === 'share') toast('Copies the join link for this artist’s team (mock)'); else go(el.dataset.go); },
  theme: t => { setTheme(t); route(); },
  fresh: (id, el) => { if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = 'Tap again — this clears the sample data'; return; } DB = blank(); save(); S.artistId = 'all'; S.showId = null; S.tourId = null; route(); toast('Clean slate. Bring your data in.'); openImportWizard(); },
  gosettle: id => { S.showId = id; go('settle'); },
  sort: k => { S.sort = { k, dir: S.sort.k === k ? -S.sort.dir : 1 }; route(); },
  bulkStatus: () => { const st = $('#bulkst').value; S.sel.forEach(id => { const s = show(id); if (s) s.status = st; }); commit(`${S.sel.size} shows set to ${st}`, `Set ${S.sel.size} shows to ${st}`); S.sel.clear(); route(); },
  bulkClear: () => { S.sel.clear(); route(); },
  acceptOffer: id => {
    const o = DB.offers.find(x => x.id === id); o.status = 'accepted';
    const s = { id: uid('sh'), artist: o.artist, tour: '', date: o.date, city: o.city, venue: o.venue, cap: o.cap, status: 'hold', hold: 1, cur: 'USD', address: '', wifi: '', parking: '', hospitality: '', note: `From ${o.promoter}`, guestCap: 24, settled: null, deal: { type: 'vs', g: o.g || 0, pct: 85, dep: Math.round((o.g || 0) / 2), depDue: addDays(o.date, -30), depPaid: false } };
    const key = Object.keys(CITIES).find(c => s.city.toLowerCase().startsWith(c)); if (key) s.ll = CITIES[key];
    DB.shows.push(s); DB.templates.advance.forEach(t => DB.tasks.push({ id: uid('k'), show: s.id, label: t.label, owner: t.owner, due: addDays(s.date, -t.before), status: 'To do', comments: [] }));
    commit(`${o.city} is on the season board as Hold 1`, `Accepted offer: ${o.city} · ${o.venue} (Hold 1)`);
  },
  declineOffer: id => { const o = DB.offers.find(x => x.id === id); o.status = 'declined'; commit(`Declined ${o.city}`, `Declined offer: ${o.city}`); },
  depPaid: id => { const s = show(id); s.deal.depPaid = true; commit('Deposit marked received', `Deposit received: ${money(s.deal.dep, false, s.cur)} from ${s.venue}`); },
  markSettled: id => { const s = show(id); s.settled = settle(s).earns; commit(`Settled at ${money(s.settled, true, s.cur)}`, `Settled ${cityOf(s)}: ${money(s.settled, false, s.cur)}`); },
  guestSet: (id, el) => { const g = DB.guests.find(x => x.id === id); g.status = el.dataset.v; commit(g.status === 'approved' ? 'Approved — on the list' : 'Declined', `${g.status === 'approved' ? 'Approved' : 'Declined'} guest ${g.name}`); },
  applyAdv: id => { const s = show(id); DB.templates.advance.forEach(t => DB.tasks.push({ id: uid('k'), show: id, label: t.label, owner: t.owner, due: addDays(s.date, -t.before), status: 'To do', comments: [] })); commit('Advance tasks added from your template'); },
  applySlots: id => { DB.templates.slots.forEach(t => DB.slots.push({ id: uid('s'), show: id, time: t.time, label: t.label, who: '', key: false })); commit('Day sheet started from your template — tap ✎ to adjust times'); },
  unsup: id => { const x = DB.supply.find(y => y.id === id); DB.supply = DB.supply.filter(y => y !== x); commit(`Removed “${x.label}”`); },
  resetAccess: id => { DB.people[id].over = {}; commit('Back to role defaults'); },
  preview: k => { setRole(k); toast(`Now seeing GigTrip as ${KINDS[k]}`); },
  openPerson: id => { S.open.add(id); go('party'); },
  rates: () => openForm({ title: 'Rates', value: DB.settings, fields: [{ k: 'perDiem', label: 'Per diem ($ per day)', type: 'money', full: true }, { k: 'agentPct', label: 'Agent commission %', type: 'number' }, { k: 'mgmtPct', label: 'Management commission %', type: 'number' }], onSave(o) { Object.assign(DB.settings, o); toast('Rates saved'); } }),
  reset: (id, el) => { if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = 'Tap again to reset everything'; return; } DB = seed(); save(); S.showId = 'nyc'; S.tourId = 't1'; route(); toast('Sample data restored'); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-go],[data-show],[data-tab],[data-mtab],[data-toast],[data-filter] button');
  if (!t || t.closest('dialog')) return;
  if (e.target.closest('input,select,textarea,label.upload') && !e.target.closest('[data-act] input')) return;
  if (t.dataset.act) { e.preventDefault(); const f = ACT[t.dataset.act]; if (f) f(t.dataset.id, t); return; }
  if (t.dataset.toast) return toast(t.dataset.toast);
  if (t.dataset.show) { S.showId = t.dataset.show; S.showTab = ''; return navFor().some(n => n[0] === 'show') ? go('show') : toast('Management and the tour manager open the show page'); }
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.tab) { S.showTab = t.dataset.tab; return route(); }
  if (t.dataset.mtab) { S.moneyTab = t.dataset.mtab; return route(); }
  const f = t.closest('[data-filter]');
  if (f) { S[f.dataset.filter] = t.dataset.v; S.sel.clear(); route(); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.pcard')) d.open ? S.open.add(d.dataset.person) : S.open.delete(d.dataset.person); }, true);
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (el.closest('dialog')) return;
  if (el.id === 'pick') { S.showId = el.value; return route(); }
  if (el.id === 'setpick' || el.id === 'gpick') { S.showId = el.value; return route(); }
  if (el.id === 'tourpick' || el.id === 'btour') { S.tourId = el.value; return route(); }
  if (el.id === 'artpick') { S.artistId = el.value; store.set('artist', el.value); S.sel.clear(); return route(); }
  if (el.id === 'commpick') { S.commArtist = el.value; return route(); }
  if (el.id === 'selall') { DB.shows.forEach(s => el.checked ? S.sel.add(s.id) : S.sel.delete(s.id)); return route(); }
  if (d.sel) { el.checked ? S.sel.add(d.sel) : S.sel.delete(d.sel); return route(); }
  if (d.taskdone) { const t = DB.tasks.find(x => x.id === d.taskdone); t.status = el.checked ? 'Done' : 'To do'; return commit(el.checked ? 'Done' : 'Reopened', `${el.checked ? 'Finished' : 'Reopened'} "${t.label}" (${cityOf(show(t.show))})`); }
  if (d.taskst) { const t = DB.tasks.find(x => x.id === d.taskst); t.status = el.value; return commit(`Status: ${el.value}`, `"${t.label}" → ${el.value}`); }
  if (d.sup) { const it = DB.supply.find(x => x.id === d.sup); it.ok = el.checked; return commit(it.ok ? 'Confirmed — management can see it' : 'Marked not ready', `${it.ok ? 'Confirmed' : 'Unconfirmed'} "${it.label}"`); }
  if (d.acc) { DB.access[d.acc][d.area] = el.value; return commit(`${KINDS[d.acc]}: ${AREAS.find(a => a[0] === d.area)[1].split(' (')[0]} → ${el.selectedOptions[0].text}`, `Changed ${KINDS[d.acc]} access: ${AREAS.find(a => a[0] === d.area)[1]} → ${el.value}`); }
  if (d.over) { const p = DB.people[d.over]; if (el.value === (DB.access[p.kind] || {})[d.area]) delete p.over[d.area]; else p.over[d.area] = el.value; return commit(`${p.name.split(' ')[0]}'s access updated`, `Changed ${p.name}'s access: ${d.area} → ${el.value}`); }
  if (d.upload) uploadFiles(d.upload, d.id, el.files);
  if (d.artistphoto && el.files[0]) setArtistPhoto(artist(d.artistphoto), el.files[0]);
});
document.addEventListener('input', e => {
  if (e.target.id === 'hq') { S.hq = e.target.value; const pos = e.target.selectionStart; route(); const q = $('#hq'); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; route(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (!['sold', 'price', 'feeper', 'wh'].includes(e.target.id)) return;
  const s = show(S.showId) && show(S.showId).status !== 'cancelled' ? show(S.showId) : show('nyc');
  const st = sheetFor(s);
  const cents = v => Math.round(parseFloat(String(v).replace(/[^0-9.]/g, '')) * 100);
  const sold = parseInt($('#sold').value.replace(/\D/g, ''), 10), price = cents($('#price').value), fee = cents($('#feeper').value), wh = cents($('#wh').value);
  if (Number.isFinite(sold)) st.sold = sold;
  if (Number.isFinite(price)) st.price = price;
  if (Number.isFinite(fee)) st.feePer = fee;
  st.withholding = Number.isFinite(wh) ? wh : 0;
  save();
  $('#settle-sheet').innerHTML = settleRows(s, settle(s));
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.closest('dialog')) return;
  if (f.dataset.addsup) {
    e.preventDefault();
    const k = f.dataset.addsup, txt = f.querySelector('input').value.trim();
    if (!txt) return;
    DB.supply.push({ id: uid('u'), person: k, label: txt, ok: false }); S.open.add(k);
    commit(`Added for ${P(k).name.split(' ')[0]} — shows on their Today screen`, `${P(k).name} to bring: ${txt}`);
    document.getElementById('add-' + k)?.focus();
    return;
  }
  if (f.id !== 'guestform') return;
  e.preventDefault();
  const name = $('#gname').value.trim(); if (!name) return;
  const approve = canEdit('guests'), s = show(S.showId) || show('nyc');
  DB.guests.push({ id: uid('g'), show: s.id, name, plus: +$('#gplus').value, by: me(), status: approve ? 'approved' : 'pending' });
  commit(approve ? 'Added to the list' : 'Sent to Dana for approval', `${approve ? 'Added' : 'Asked for'} guest ${name} (${cityOf(s)})`);
});
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (!z) return;
  e.preventDefault();
  z.classList.toggle('drag', ev === 'dragover');
  if (ev === 'drop') uploadFiles(z.dataset.drop, z.dataset.id, e.dataTransfer.files);
}));

route();
</script>
