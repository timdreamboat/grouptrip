# Publishes the app/ folder to GitHub Pages on every push to main,
# plus the GigTrip mock at /gigtrip/ (gigtrip/mock/index.html, wrapped in a page skeleton).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (app + GigTrip mock)
        run: |
          mkdir -p site/gigtrip
          cp -R app/. site/
          { printf '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'; cat gigtrip/mock/index.html; printf '\n</html>\n'; } > site/gigtrip/index.html
          cp -R gigtrip/demo site/gigtrip/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
